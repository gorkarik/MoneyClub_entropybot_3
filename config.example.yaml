# MoneyClub 3 — настройки бота
#
# Обычно этот файл руками трогать не нужно: пороги и лимиты меняются
# через меню (команда moneyclub → Настройки). Меню само создаёт config.yaml
# из этого шаблона при первом запуске.
#
# Ключи (секреты) здесь НЕ хранятся — они лежат в .env.
# Все названия параметров проверяются при старте: опечатка в имени —
# это ошибка запуска, а не тихо проигнорированная настройка.
#
# Биржа хеджа и тикер в этом файле не задаются, их выбирают в меню при Старте:
# Lighter RH (lighter-rh), Lighter core (lighter) или Ondo (ondo). Первая нога — Hyperliquid:
# Entropy (dex io, её активность засчитывается) или основная биржа Hyperliquid
# (BTC, ETH, SOL; активность Entropy не засчитывается). Где торгуется тикер,
# меню проверяет перед запуском и записывает в файл пары (entropy.dex).
#
# У каждой пары «биржа + тикер» свой файл tickers/<биржа>/<ТИКЕР>.yaml (меню
# создаёт их само): пороги, комиссии, лимит позиции и размер сделки, файл
# минутных данных и имена рынка на биржах. Эти значения ЗАМЕНЯЮТ значения
# отсюда. Пороги (thresholds) ниже нужны только при самом первом запуске
# меню: они переносятся в tickers/lighter-rh/SNDK.yaml, дальше бот их отсюда
# не берёт.
# Общими для всех пар остаются: исполнение, лесенка, лимит убытка (risk).

# ================================ БОТ =================================
bot:
  nickname: ""          # имя бота: под заставкой и в Telegram (меню: Настройки → Имя бота)

# =============================== СИГНАЛ ===============================
# premium_bps = (цена Entropy / цена хеджа − 1) × 10000
#
#   ПРОДАТЬ entropy + КУПИТЬ хедж   когда премия >= midline + upper
#   КУПИТЬ entropy + ПРОДАТЬ хедж   когда премия <= midline − lower
#
# Оба порога считаются уже ПОСЛЕ комиссий (бот сам добавляет комиссии
# сверху), поэтому полный цикл вход+выход даёт >= upper + lower bps.
#
# Значения по умолчанию — калибровка по ~4 суткам записи SNDK/RH.
# Премия со временем дрейфует: раз в неделю делайте «Анализ / калибровку».
thresholds:
  midline_bps: -7.0    # обычный уровень премии (центр коридора)
  upper_bps: 4.0       # на сколько выше центра — продаём Entropy
  lower_bps: 4.5       # на сколько ниже центра — покупаем Entropy

# =============================== БИРЖИ ================================
entropy:
  dex: io                    # первая нога по умолчанию: io — Entropy, main — основная Hyperliquid (у пары — свой, в её файле)
  taker_fee_bps: 0.0         # комиссия Entropy В РАСЧЁТЕ ВХОДА, bps
  # Число влияет только на то, когда бот входит: он прибавляет его к порогу.
  # Биржа списывает свою комиссию в любом случае: сейчас 0.86 bps при сделке
  # (сниженный режим Entropy; если его отменят — примерно в 10 раз больше).
  # Раз в 2 недели часть комиссии возвращается в долларах (по уровню).
  # Варианты в меню (Настройки → Комиссии): 0 — не учитывать (по умолчанию),
  # 0.17 — остаток после возврата 80% (уровень 1), 0.86 — полностью.
  max_position_usd: 25       # лимит позиции, $ (меню меняет его сразу в обеих секциях)
  max_orders_per_min: 120    # лимит отправки ордеров в минуту

hedge:
  taker_fee_bps: 0.0         # у Lighter 0; у Ondo 2.5 (пишется в файл пары)
  max_position_usd: 25       # лимит позиции, $ (должен совпадать с entropy)
  max_orders_per_min: 30     # потолок Lighter ~40 в минуту, держим запас

# ============================ РАЗМЕР СДЕЛОК ===========================
sizing:
  take_fraction: 0.5           # какую долю выгодной глубины стакана забирать
  max_order_notional_usd: 20   # максимум на одну сделку, $
  min_order_notional_usd: 10   # сделки меньше этой суммы не отправляются

# ======================== ЛЕСЕНКА ПО ПОЗИЦИИ ==========================
# Чем ближе позиция к лимиту в одну сторону, тем большую премию бот
# требует для добавления в ту же сторону (линейно до scale_bps на 100%
# лимита). Не даёт быстро набить односторонний перекос. 0 — выключено.
inventory:
  scale_bps: 10.0      # надбавка к порогу при позиции на весь лимит, bps
  floor_frac: 0.5      # с какой доли лимита позиции начинается надбавка

# ============================== ИСПОЛНЕНИЕ ============================
execution:
  premium_persist_sec: 0.3     # сколько секунд сигнал должен держаться до входа
  cooldown_sec: 0.0            # минимальная пауза между сделками
  settle_timeout_sec: 10.0     # ожидание подтверждения исполнения
  leg_slippage_bps: 50.0       # защита от проскальзывания на каждой ноге
  hedge_slippage_bps: 20.0     # защита цены при выравнивании дельты
  net_tolerance_base: 0.001    # допустимый перекос позиций (в базовом активе)
  max_consecutive_errors: 3    # после N ошибок подряд — аварийная остановка
  rate_limit_pause_sec: 10.0   # пауза, если биржа ограничила частоту запросов
  staleness_sec: 10.0          # данные старше — считаются устаревшими
  reconcile_sec: 15.0          # как часто сверять позиции с биржей
  venue_probe_sec: 30.0        # как часто проверять недоступную биржу
  http_keepalive_sec: 10.0     # держать соединение для ордеров «тёплым»; 0 — выкл.
  # --- стратегия (меню: Настройки → Стратегия), выбирается одна ---
  # simultaneous  — 1 · Обе ноги сразу: оба ордера одновременно (по умолчанию)
  # entropy_first — 2 · Сначала Entropy: ордер на Entropy с жёстким пределом
  #                 цены, хедж только на исполненный объём; исчезнувший
  #                 сигнал просто не исполнится
  # volume        — 3 · Объём: как 2, полоса уже на 2 bps, но $10 000 объёма
  #                 на Entropy не дороже $1 (оба числа вшиты в бота)
  # grid          — 4 · Сетка: обе ноги сразу; лесенка вокруг медианы премии
  #                 за grid_centre_hours: каждая ступень grid_step_bps,
  #                 каждый круг зарабатывает один шаг, бот не встаёт, когда
  #                 премия уходит; глубину ограничивает лимит позиции
  mode: simultaneous
  grid_step_bps: 4          # сетка: шаг лесенки, bps (1–50)
  grid_centre_hours: 24     # сетка: центр = медиана премии за столько часов
  # худшая цена на Entropy в стратегиях 2 и 3:
  #   profit — из прибыли сделки: весь запас премии сверх порога плюс доля
  #            полосы (1 − entropy_first_keep), от 0.5 до 3 × entropy_first_slip_bps
  #   fixed  — всегда entropy_first_slip_bps
  entropy_first_limit: profit
  entropy_first_keep: 0.5
  entropy_first_slip_bps: 5.0
  # перекос стакана Entropy против сделки (во сколько раз): пишется в журнал
  # всегда; если задать (1.2..50), новые позиции при большем перекосе
  # пропускаются; 0 — только записывать
  imbalance_max: 0
  # вход на откате: новая позиция, когда премия откатилась от пика на
  # столько bps (всё ещё выше порога); 0 — выкл.
  retrace_bps: 0
  # быстрый рынок: порог открытия + vol_k × размах цены Entropy за минуту;
  # 0 — выкл., разумно 0.2–1
  vol_k: 0
  # мейкер-ордер на Entropy (post-only), хедж тейкером после исполнения:
  #   shadow — теневой режим: ордеров нет, бот записывает, где стоял бы его
  #            ордер и исполнился ли бы он (logs/maker_shadow.csv);
  #   live   — настоящие ордера, только на закрытие, с автоотменой на бирже;
  #   off    — выключено
  maker_mode: shadow
  maker_fee_bps: 1.5        # комиссия мейкера на Entropy, проверьте свою
  maker_requote_bps: 1.0    # переставлять, если нужная цена ушла на столько
  maker_requote_sec: 3      # и не чаще чем раз в столько секунд
  maker_inside_bps: 2.0     # не лучше лучшей цены своей стороны больше чем на
  maker_deadman_sec: 60     # автоотмена всех ордеров, если бот замолчал
  # защита: пропуск подозрительно больших сигналов — премия обгоняет порог
  # входа больше чем на столько bps (обычно устаревший стакан); 0 — выкл.
  max_excess_bps: 0

# ============== ЗАЩИТА: ПОПРАВКА НА ПОТЕРИ ПРИ ИСПОЛНЕНИИ ===============
# Бот всегда запоминает, насколько хуже плана исполнялась каждая нога
# (logs/slip_<биржа>_<ТИКЕР>.json). Если enabled, сделка, открывающая
# позицию, должна дополнительно покрыть 2 × медиану этого проскальзывания
# на обеих биржах (вход + выход). Закрытие позиции не ограничивается.
slipgate:
  enabled: false
  weight: 1.0                  # множитель надбавки
  lookback_hours: 48           # учитываются сделки не старше
  min_fills: 5                 # меньше сделок — надбавки нет
  max_samples: 50              # сколько последних сделок помнить

# ============================ СТОП ПО УБЫТКУ ==========================
# Сессия — один запуск бота, от Старт до Стоп. При Старте бот запоминает
# общий баланс обеих бирж (читает его с самих бирж). Если за сессию убыток
# дошёл до лимита (два замера подряд), бот закрывает обе ноги и перестаёт
# торговать: в меню и на дашборде — СТОП ПО УБЫТКУ.
# Следующий Старт — новая сессия с новым стартовым балансом, поэтому
# пополнять и выводить деньги можно между сессиями, ничего не нажимая.
# Во время работы бота деньги не заводите и не выводите.
#
# При любой остановке (Стоп в меню, смена настроек) бот сначала закрывает
# обе ноги, затем показывает итог сессии.
#
# Секции может не быть (старый config.yaml) — тогда действуют эти же
# значения по умолчанию.
risk:
  max_loss_pct: 3              # лимит убытка за сессию, % от баланса на старте; 0 — выключено
  check_sec: 15.0              # как часто читать баланс (и сразу после каждой сделки)
  confirm_interval_sec: 10.0   # стоп — только если 2 замера подряд за лимитом, через столько секунд
  max_equity_misses: 5         # столько неудачных чтений подряд — пауза торговли (если лимит задан)
  max_read_skew_sec: 3.0       # ответы бирж дальше друг от друга — замер не засчитывается
  flatten_slippage_bps: 100.0  # защита цены при закрытии позиций (шире обычной)
  flatten_attempts: 3          # попыток закрыть позиции
  flatten_on_halt: false       # закрывать ли позиции сразу при аварийном стопе по ошибкам
                               # по умолчанию нет: ноги остаются выровненными;
                               # меняется в меню: Настройки → Стоп по убытку

# ======================= АВТОКАЛИБРОВКА ЦЕНТРА ========================
# Выключена по умолчанию; включается в меню: Настройки → Автокалибровка.
# Раз в every_hours бот сдвигает ТОЛЬКО midline_bps текущей пары к медиане
# премии за window_hours: не больше max_step_bps за раз, не дальше
# max_drift_bps от центра, заданного вручную, и только когда нет открытой
# позиции. Нужно хотя бы min_hours данных. Каждое изменение — в журнале,
# logs/autocalib.csv и Telegram. Центр, заданный вручную, — новая точка отсчёта.
autocalib:
  enabled: false
  window_hours: 72       # период медианы: 24 / 72 / 168
  every_hours: 24        # как часто пересчитывать
  max_step_bps: 1.0      # наибольший сдвиг за раз
  max_drift_bps: 3.0     # наибольшее отклонение от ручного центра
  min_hours: 18          # меньше данных в периоде — центр не трогается

# ========================= АВТОПОДБОР ПОЛОСЫ ==========================
# Выключен по умолчанию. Раз в every_hours бот прогоняет бэктест по
# стаканам, записанным за days дней: текущая полоса, на 1 bps уже и на
# 1 bps шире (сдвигаются обе стороны сразу). Переходит на другой вариант,
# только если тот в плюсе и лучше текущего на min_gain_pct % и хотя бы на
# $0.05, а у текущей полосы в бэктесте не меньше 20 сделок. Не дальше
# max_drift_bps от полосы, заданной вручную, и не уже 1.5 bps с каждой
# стороны. Центр не трогает. Изменения — в файле пары, logs/autotune.csv,
# журнале и Telegram. Полоса, заданная вручную, — новая точка отсчёта.
autotune:
  enabled: false
  every_hours: 24        # как часто проверять
  days: 3                # сколько дней записей брать
  max_drift_bps: 2.0     # наибольшее отклонение от ручной полосы
  min_hours: 24          # меньше записей — полоса не трогается
  min_gain_pct: 20       # насколько лучше должен быть другой вариант

# ============================== ПРИСМОТР ==============================
# Бот работает без присмотра. При любой остановке или паузе — сообщение в
# Telegram. Паузы держат только НОВЫЕ позиции, закрытие к центру идёт всегда.
# В Telegram: /pause — не открывать новые позиции, /resume — снять паузу.
guard:
  error_pause_min: 15          # после серии ошибок исполнения — пауза, мин (0 — сразу стоп)
  error_pauses_before_halt: 3  # столько пауз подряд, потом полная остановка
  # Паузы «сделки в минусе» выключены: бот работает ради объёма. Вернуть —
  # lowprofit_on: true (тогда действуют четыре строки ниже).
  lowprofit_on: false
  lowprofit_hours: 6           # окно проверки, ч
  lowprofit_min_trades: 10     # меньше сделок в окне — проверка не срабатывает
  lowprofit_loss_bps: 1        # минус меньше стольких bps оборота за окно — шум, не пауза
  lowprofit_pause_hours: 2     # длина этой паузы, ч
  drawdown_24h_pct: 0          # просадка баланса от максимума за 24 ч, % → пауза (0 — выкл)
  heartbeat_hours: 24          # «бот работает» в Telegram раз в столько часов (0 — выкл)

# ============================ АВТОКОРИДОР =============================
# Включён по умолчанию (если секции нет — те же значения). Пороги входа идут
# за рынком: бот входит, когда реальная выгода сделки (по лучшим ценам, с
# комиссиями) в лучших share долях за последние window_min минут. Если круг
# «открыть + закрыть» по таким порогам хуже, чем −2 × max_cost_usd bps,
# оба порога поднимаются. Пока данных меньше min_min минут — пороги пары.
autoband:
  enabled: true
  window_min: 30          # окно, минут
  min_min: 10             # меньше данных — пороги из файла пары
  share: 0.3              # доля лучшего времени, в которую бот входит (0.05–0.5)
  # Режимы в меню (Настройки → 5): «Объём» share 0.3 / max_cost_usd 1,
  # «Баланс» 0.3 / 0 (по умолчанию), «Доход» 0.2 / -0.5.
  max_cost_usd: 0         # цена объёма, $ на $10 000 оборота Entropy: 1 — можно терять $1; 0 — круг не дороже нуля; -0.5 — круг от +1 bps

# ============================ АВТОНОМНОСТЬ ============================
# Включена по умолчанию: бот сам держит коридор у рынка и не застывает.
# Если секции нет в config.yaml, действуют эти же значения.
#
# 1. Плавающий центр. Центр коридора = медиана премии за window_min минут,
#    обновляется каждые 10 с, в том числе при открытой позиции. Не уходит
#    дальше max_drift_bps от центра из файла пары (защита от плохих данных).
#    Файл пары не меняется: плавающий центр живёт, пока бот работает.
# 2. Выход к центру. Порог ЗАКРЫТИЯ позиции снижается от полного коридора
#    к центру (± exit_floor_bps): линейно за exit_hours часов удержания и,
#    до size_weight пути, по мере заполнения второй половины лимита.
#    Закрывающая сделка не больше самой позиции.
# 3. Спокойный набор. Сделки, увеличивающие позицию, — не чаще раза в
#    open_cooldown_sec секунд. Если медиана премии за jump_window_min минут
#    ушла от центра дальше jump_bps (скачок уровня), новые позиции ждут,
#    пока центр догонит рынок. Закрытие не ограничивается.
autonomy:
  enabled: true
  window_min: 60          # окно медианы для центра, минут
  min_min: 20             # меньше данных — центр берётся из файла пары
  max_drift_bps: 50       # наибольший уход центра от центра пары, bps
  exit_hours: 6           # за сколько часов порог закрытия доходит до центра
  exit_floor_bps: 0       # насколько дальше центра закрывать в конце, bps
  size_weight: 0.5        # доля пути к центру при позиции на весь лимит
  open_cooldown_sec: 30   # пауза между сделками, открывающими позицию, с
  jump_bps: 20            # скачок премии, при котором новые позиции ждут, bps
  jump_window_min: 5      # за сколько минут считать скачок
  # Если рынок дольше этого времени (минут) остаётся дальше max_drift_bps
  # от центра пары, бот сам переносит центр пары на рынок (в файл пары, с
  # сообщением в Telegram). 0 — не переносить, тогда бот стоит, пока вы
  # не перекалибруете пару вручную.
  recentre_min: 30

# ============================= ЗАПИСЬ ДАННЫХ ==========================
# Пока бот работает (в любом режиме), он раз в секунду снимает оба стакана
# и раз в минуту пишет строку в CSV. Эти данные использует анализ.
recorder:
  enabled: true
  csv: logs/minutes.csv
  # Частый срез стаканов для бэктестера: раз в ticks_sec секунд — лучшие
  # цены и объёмы обеих бирж и средняя цена сделки на максимальный размер.
  # Файл на пару и день в ticks_dir, вчерашние файлы сжимаются (.csv.gz).
  # Раз в 0.5 с — чтобы бэктест мог честно учесть задержку 0.3–0.9 с.
  # Около 28 МБ в сутки на пару, после сжатия 5–7 МБ. От 0.25 до 60 с,
  # 0 — выключено.
  ticks_sec: 0.5
  ticks_dir: logs/ticks

# ============================= ЛОГИ И ДАШБОРД =========================
logging:
  level: INFO
  status_interval_sec: 30.0
  trades_csv: logs/trades.csv
  dashboard: true
  file: logs/engine.log
